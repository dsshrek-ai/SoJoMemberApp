<main id="main-content">
  <h2>Member Recognition</h2>
  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const rows = await fetchData('recognition');
      if (!rows.length) {
        el.innerHTML = `<p class="placeholder-note">No recognitions posted yet.</p>`;
        return;
      }
      const sorted = rows.slice().sort((a, b) => new Date(b.Date) - new Date(a.Date));
      el.innerHTML = sorted.map(r => `
        <div class="card">
          <p><strong>${escapeHtml(r.Date)}</strong>${r.MemberName ? ' &mdash; <strong>' + escapeHtml(r.MemberName) + '</strong>' : ''}</p>
          ${formatText(r.Message)}
        </div>
      `).join('');
    } catch (e) {
      showPlaceholder(el, "Couldn't load right now — check your connection and try refreshing.");
    }
  })();
</script>
</body>
