<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Us | Choir App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>SOJO Choral Arts Seasons Chorale Choir</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="announcements.html">Announcements</a>
    <a href="schedule.html">Schedule</a>
    <a href="volunteer.html">Volunteer</a>
    <a href="songs.html">Songs</a>
    <a href="absent.html">Report Absence</a>
    <a href="myinfo.html">My Info</a>
    <a href="recognition.html">Recognition</a>
    <a href="sponsors.html">Sponsors &amp; Giving</a>
    <a href="join.html" aria-current="page">Join Us</a>
    <a href="instructions.html">Instructions</a>
  </nav>
</header>
<main id="main-content">
  <h2>New Members &amp; Auditions</h2>
  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const settings = await fetchData('settings');
      const val = (key) => (settings.find(s => s.Key === key) || {}).Value;
      const registrationUrl = val('NewMemberFormURL');
      const auditionText = val('AuditionInfoText');
      const auditionUrl = val('AuditionFormURL');
      el.innerHTML = `
        <div class="card">
          <h3>Invite a New Member</h3>
          ${registrationUrl ? `
            <p>Know someone who'd love to join our choir? Copy the registration link below and paste it into a text or email to invite them.</p>
            <p><button type="button" class="btn" id="copy-link-btn">Copy Link</button></p>
            <div id="copy-status" class="placeholder-note" style="display:none;"></div>
          ` : '<p class="placeholder-note">Registration link not set yet.</p>'}
        </div>
        <div class="card">
          <h3>Audition Opportunities</h3>
          ${formatText(auditionText)}
          ${auditionUrl ? `<p><a class="btn" href="${escapeHtml(auditionUrl)}" target="_blank" rel="noopener">Sign Up to Audition</a></p>` : ''}
        </div>
      `;

      if (registrationUrl) {
        const copyBtn = document.getElementById('copy-link-btn');
        const copyStatus = document.getElementById('copy-status');
        copyBtn.addEventListener('click', () => {
          copyToClipboard(registrationUrl, copyBtn, (text) => {
            copyStatus.textContent = `Couldn't copy automatically — here's the link: ${text}`;
            copyStatus.style.display = '';
          });
        });
      }
    } catch (e) {
      showPlaceholder(el, "Couldn't load right now — check your connection and try refreshing.");
    }
  })();
</script>
</body>
</html>
