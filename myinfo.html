<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Info | Choir App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>SOJO Choral Arts Seasons Chorale Choir</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="announcements.html">Announcements</a>
    <a href="schedule.html">Schedule</a>
    <a href="volunteer.html">Volunteer</a>
    <a href="songs.html">Songs</a>
    <a href="absent.html">Report Absence</a>
    <a href="myinfo.html" aria-current="page">My Info</a>
    <a href="recognition.html">Recognition</a>
    <a href="sponsors.html">Sponsors &amp; Giving</a>
    <a href="join.html">Join Us</a>
    <a href="instructions.html">Instructions</a>
    <a href="countdown.html">Countdown</a>
  </nav>
</header>
<main id="main-content">
  <h2>My Info</h2>

  <div class="card member-lookup">
    <label for="lookup-email">Your Email</label>
    <input type="email" id="lookup-email" placeholder="you@example.com">
    <p><button type="button" class="btn" id="lookup-btn">Look Up</button></p>
    <div id="lookup-status"></div>
  </div>

  <div id="content"></div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  const lookupEmailInput = document.getElementById('lookup-email');
  const lookupBtn = document.getElementById('lookup-btn');
  const lookupStatusEl = document.getElementById('lookup-status');
  const contentEl = document.getElementById('content');

  const ATTENDANCE_COLOR_CLASS = {
    green: 'color-green',
    yellow: 'color-yellow',
    gray: 'color-gray',
  };

  async function renderMemberInfo(email) {
    contentEl.innerHTML = `<p class="placeholder-note">Loading&hellip;</p>`;

    let attendanceResult;
    try {
      attendanceResult = await lookupMyAttendance(email);
    } catch (e) {
      contentEl.innerHTML = `<p class="placeholder-note">Couldn't load your info right now — check your connection and try refreshing.</p>`;
      return;
    }

    if (!attendanceResult.ok) {
      contentEl.innerHTML = '';
      return;
    }

    const member = attendanceResult.member;
    const attendance = attendanceResult.attendance || [];

    let leaderHtml = '';
    if (member.position) {
      try {
        const leaderResult = await lookupSectionLeader(member.position);
        const leader = leaderResult.leader || {};
        if (leader.name || leader.email || leader.phone) {
          leaderHtml = `
            <div class="card">
              <h3>Your Section Leader</h3>
              <p>${escapeHtml(leader.name || 'Contact')}</p>
              ${contactButtonsHtml(leader.phone, leader.email)}
            </div>
          `;
        }
      } catch (e) {
        // Section leader contact is a bonus, not required — a failure here
        // shouldn't block the rest of the page from rendering.
      }
    }

    const attendanceRows = attendance.length
      ? attendance.map(a => `
          <tr>
            <td>${escapeHtml(a.date)}</td>
            <td><span class="attendance-status ${ATTENDANCE_COLOR_CLASS[a.color] || 'color-gray'}">${escapeHtml(a.label)}</span></td>
          </tr>
        `).join('')
      : `<tr><td colspan="2">No attendance recorded yet.</td></tr>`;

    contentEl.innerHTML = `
      <div class="card">
        <h3>Your Details</h3>
        <p><strong>${escapeHtml(member.name || '')}</strong></p>
        <p>Section/Position: ${escapeHtml(member.position || 'Not on file')}</p>
        <p>Email: ${escapeHtml(member.email || '')}</p>
        <p>Phone: ${escapeHtml(member.cellPhone || member.homePhone || 'Not on file')}</p>
        <p class="placeholder-note">Want to make changes to your attendance record or contact details? Reach out to your section leader below.</p>
      </div>

      ${leaderHtml}

      <div class="card">
        <h3>Your Attendance</h3>
        <div class="admin-table-wrap">
          <table class="attendance-table">
            <thead><tr><th scope="col">Date</th><th scope="col">Status</th></tr></thead>
            <tbody>${attendanceRows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  async function runLookup() {
    const email = lookupEmailInput.value.trim();
    lookupStatusEl.innerHTML = '';
    contentEl.innerHTML = '';
    if (!email) return;
    lookupBtn.disabled = true;
    try {
      const result = await lookupMember(email);
      if (result.ok) {
        saveEmail(email);
        lookupStatusEl.innerHTML = `<p class="found-note">Showing info for <strong>${escapeHtml(result.member.name || email)}</strong>. <a class="not-you" id="not-you-link">Not you?</a></p>`;
        document.getElementById('not-you-link').addEventListener('click', () => {
          clearSavedEmail();
          lookupEmailInput.value = '';
          lookupStatusEl.innerHTML = '';
          contentEl.innerHTML = '';
        });
        await renderMemberInfo(email);
      } else {
        lookupStatusEl.innerHTML = `<p class="placeholder-note">${escapeHtml(notFoundMessage(email))}</p>`;
      }
    } catch (e) {
      lookupStatusEl.innerHTML = `<p class="placeholder-note">Couldn't look that up right now — check your connection and try again.</p>`;
    }
    lookupBtn.disabled = false;
  }

  lookupBtn.addEventListener('click', runLookup);
  lookupEmailInput.addEventListener('keydown', e => { if (e.key === 'Enter') runLookup(); });

  (async () => {
    await captureSsoEmail();
    const savedEmail = getSavedEmail();
    if (savedEmail) {
      lookupEmailInput.value = savedEmail;
      runLookup();
    }
  })();
</script>
</body>
</html>
