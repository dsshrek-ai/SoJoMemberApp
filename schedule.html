<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule | Choir App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1>South Jordan Choral Arts Community Choir</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="schedule.html" aria-current="page">Schedule</a>
    <a href="songs.html">Songs</a>
    <a href="lyrics.html">Lyrics</a>
    <a href="announcements.html">Announcements</a>
    <a href="volunteer.html">Volunteer</a>
    <a href="absent.html">Report Absence</a>
    <a href="recognition.html">Recognition</a>
    <a href="sponsors.html">Sponsors &amp; Giving</a>
    <a href="folders.html">Music Folders</a>
    <a href="join.html">Join Us</a>
  </nav>
</header>
<main>
  <h2>Rehearsals &amp; Events</h2>
  <div id="content">Loading schedule&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const rows = await fetchData('schedule');
      if (!rows.length) {
        el.innerHTML = `<p class="placeholder-note">No schedule entries yet.</p>`;
        return;
      }
      el.innerHTML = rows.map(r => `
        <div class="card">
          <span class="badge">${r.Type || 'Event'}</span>
          <h3>${r.Title || ''}</h3>
          <p><strong>${r.Date || ''}</strong> ${r.Time ? 'at ' + r.Time : ''}</p>
          ${r.Location ? `<p>Location: ${r.Location}</p>` : ''}
          ${r.ParkingNotes ? `<p>Parking: ${r.ParkingNotes}</p>` : ''}
          ${r.EntranceNotes ? `<p>Entrance: ${r.EntranceNotes}</p>` : ''}
          ${r.Notes ? `<p>${r.Notes}</p>` : ''}
        </div>
      `).join('');
    } catch (e) {
      showPlaceholder(el, "This page will list rehearsals and performances — with date, time, location, parking, and entrance details — once the site is connected to the Google Sheet (Phase 1).");
    }
  })();
</script>
</body>
</html>
