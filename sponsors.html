<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsors &amp; Giving | Choir App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>SOJO Choral Arts Seasons Chorale Choir</h1>
  <nav class="site-nav" id="site-nav"></nav>
</header>
<main id="main-content">
  <h2>Sponsors &amp; Giving</h2>
  <div id="donate-content"></div>
  <h2>Our Sponsors</h2>
  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const donateEl = document.getElementById('donate-content');
    try {
      const settings = await fetchData('settings');
      const donationUrl = (settings.find(s => s.Key === 'DonationURL') || {}).Value;
      donateEl.innerHTML = donationUrl
        ? `<div class="card"><a class="btn" href="${donationUrl}" target="_blank" rel="noopener">Support the Choir</a></div>`
        : `<p class="placeholder-note">No donation link has been set yet.</p>`;
    } catch (e) {
      handleFetchError(donateEl, e);
    }

    const el = document.getElementById('content');
    try {
      const rows = await fetchData('sponsors');
      if (!rows.length) {
        el.innerHTML = `<p class="placeholder-note">No sponsors listed yet.</p>`;
        return;
      }
      el.innerHTML = rows.map(r => `
        <div class="card">
          <h3>${escapeHtml(r.SponsorName)}</h3>
          ${r.Tier ? `<span class="badge">${escapeHtml(r.Tier)}</span>` : ''}
          ${formatText(r.Message)}
          ${r.LogoURL ? `<p><a href="${escapeHtml(r.LogoURL)}" target="_blank" rel="noopener">Learn more</a></p>` : ''}
        </div>
      `).join('');
    } catch (e) {
      handleFetchError(el, e);
    }
  })();
</script>
</body>
</html>
