<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      await fetchData('lyrics');
      el.innerHTML = `<p class="placeholder-note">Lyrics data is connected. The pick-a-song, pick-a-part quick view is coming in Phase 2.</p>`;
    } catch (e) {
      showPlaceholder(el, "This page will let you pick a song and a voice part (soprano/alto/tenor/bass) and see just the lyrics, in large text, for quick review. Coming in Phase 2, once connected to the Google Sheet.");
    }
  })();
</script>
