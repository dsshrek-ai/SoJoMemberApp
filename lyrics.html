<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics | Choir App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>South Jordan Choral Arts Community Choir</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <a href="songs.html">Songs</a>
    <a href="lyrics.html" aria-current="page">Lyrics</a>
    <a href="announcements.html">Announcements</a>
    <a href="volunteer.html">Volunteer</a>
    <a href="absent.html">Report Absence</a>
    <a href="recognition.html">Recognition</a>
    <a href="sponsors.html">Sponsors &amp; Giving</a>
    <a href="folders.html">Music Folders</a>
    <a href="join.html">Join Us</a>
  </nav>
</header>
<main id="main-content">
  <h2>Lyrics by Part</h2>
  <div id="picker" style="display:none;">
    <label for="song-select">Song</label>
    <select id="song-select"></select>
    <label for="part-select">Part</label>
    <select id="part-select"></select>
  </div>
  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const contentEl = document.getElementById('content');
    const pickerEl = document.getElementById('picker');
    const songSelect = document.getElementById('song-select');
    const partSelect = document.getElementById('part-select');

    let rows = [];
    try {
      rows = await fetchData('lyrics');
    } catch (e) {
      showPlaceholder(contentEl, "This page will let you pick a song and a voice part (soprano/alto/tenor/bass) and see just the lyrics, in large text, for quick review, once connected to the Google Sheet.");
      return;
    }

    if (!rows.length) {
      contentEl.innerHTML = `<p class="placeholder-note">No lyrics have been added yet.</p>`;
      return;
    }

    function partsForSong(songTitle) {
      return rows.filter(r => r.SongTitle === songTitle).map(r => r.Part);
    }

    function renderLyrics() {
      const song = songSelect.value;
      const part = partSelect.value;
      const match = rows.find(r => r.SongTitle === song && r.Part === part);
      contentEl.innerHTML = match
        ? `<div class="card lyrics-text">${escapeHtml(match.LyricsText).replace(/\n/g, '<br>')}</div>`
        : `<p class="placeholder-note">No lyrics found for that combination.</p>`;
    }

    function populatePartsForCurrentSong() {
      const parts = partsForSong(songSelect.value);
      partSelect.innerHTML = parts.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
    }

    const songTitles = [...new Set(rows.map(r => r.SongTitle))];
    songSelect.innerHTML = songTitles.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    populatePartsForCurrentSong();

    songSelect.addEventListener('change', () => {
      populatePartsForCurrentSong();
      renderLyrics();
    });
    partSelect.addEventListener('change', renderLyrics);

    pickerEl.style.display = '';
    renderLyrics();
  })();
</script>
</body>
</html>
