</head>
<body>
<header class="site-header">
  <h1>South Jordan Choral Arts Community Choir</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>

  </nav>
</header>
<main>
  <h2>Announcements</h2>
  <div id="content">Loading announcements&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const rows = await fetchData('announcements');
      if (!rows.length) {
        el.innerHTML = `<p class="placeholder-note">No announcements yet.</p>`;
        return;
      }
      const sorted = rows.slice().sort((a, b) => {
        const aPinned = (a.Pinned || '').toUpperCase() === 'Y';
        const bPinned = (b.Pinned || '').toUpperCase() === 'Y';
        if (aPinned !== bPinned) return aPinned ? -1 : 1;
        return new Date(b.Date) - new Date(a.Date);
      });
      el.innerHTML = sorted.map(r => `
        <div class="card ${(r.Pinned || '').toUpperCase() === 'Y' ? 'pinned' : ''}">
          ${(r.Pinned || '').toUpperCase() === 'Y' ? '<span class="badge">Pinned</span>' : ''}
          <p><strong>${r.Date || ''}</strong>${r.Author ? ' &mdash; ' + r.Author : ''}</p>
          <p>${r.Message || ''}</p>
        </div>
      `).join('');
    } catch (e) {
      showPlaceholder(el, "This page will show announcements from the director and section leaders, newest first with pinned items on top, once the site is connected to the Google Sheet (Phase 1).");
    }
  })();
</script>
</body>
</html>
