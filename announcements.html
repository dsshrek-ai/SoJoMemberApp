<main id="main-content">
  <h2>Announcements</h2>
  <div id="content">Loading announcements&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const rows = await fetchData('announcements');
      if (!rows.length) {
        el.innerHTML = `<p class="placeholder-note">No announcements yet.</p>`;
        return;
      }
      const sorted = rows.slice().sort((a, b) => {
        const aPinned = (a.Pinned || '').toUpperCase() === 'Y';
        const bPinned = (b.Pinned || '').toUpperCase() === 'Y';
        if (aPinned !== bPinned) return aPinned ? -1 : 1;
        return new Date(b.Date) - new Date(a.Date);
      });
      el.innerHTML = sorted.map(r => `
        <div class="card ${(r.Pinned || '').toUpperCase() === 'Y' ? 'pinned' : ''}">
          ${(r.Pinned || '').toUpperCase() === 'Y' ? '<span class="badge">Pinned</span>' : ''}
          <p><strong>${escapeHtml(r.Date)}</strong>${r.Author ? ' &mdash; ' + escapeHtml(r.Author) : ''}</p>
          ${formatText(r.Message)}
        </div>
      `).join('');
    } catch (e) {
      showPlaceholder(el, "Couldn't load right now — check your connection and try refreshing.");
    }
  })();
</script>
</body>
</html>
