<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | Choir App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>SOJO Choral Arts Seasons Chorale Choir</h1>
  <nav class="site-nav" id="site-nav"></nav>
</header>
<main id="main-content">
  <h2>Welcome!</h2>
  <div id="content">Loading welcome message&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  // My Apps Hub launches this app at index.html, so this is where a
  // ?token=... SSO handoff actually arrives — captured here (silently, no
  // lookup box on this page) so it's already remembered by the time the
  // member clicks into Volunteer/Report Absence/My Info.
  captureSsoEmail();

  (async () => {
    const el = document.getElementById('content');
    try {
      const settings = await fetchData('settings');
      const welcome = (settings.find(s => s.Key === 'WelcomeMessage') || {}).Value;
      el.innerHTML = welcome
        ? `<div class="card">${formatText(welcome)}</div>`
        : `<p class="placeholder-note">No welcome message has been set yet. The director can add one via the admin panel (Settings &rarr; WelcomeMessage).</p>`;
    } catch (e) {
      showPlaceholder(el, "Couldn't load right now — check your connection and try refreshing.");
    }
  })();
</script>
</body>
</html>
