<body>

<header class="site-header">
  <h1>South Jordan Choral Arts Community Choir</h1>
  <nav class="site-nav">
    <a href="index.html" aria-current="page">Home</a>

<main id="main-content">
  <h2>Welcome!</h2>
  <div id="content">Loading welcome message&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const settings = await fetchData('settings');
      const welcome = (settings.find(s => s.Key === 'WelcomeMessage') || {}).Value;
      el.innerHTML = welcome
        ? `<div class="card">${welcome}</div>`
        : `<p class="placeholder-note">No welcome message has been set yet. The director can add one in the Settings tab of the Sheet.</p>`;
    } catch (e) {
      showPlaceholder(el, "This page will show a welcome message from the director once the site is connected to the Google Sheet (Phase 1).");
    }
  })();
</script>
</body>
</html>
