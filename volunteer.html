<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer | Choir App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>SOJO Choral Arts Seasons Chorale Choir</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="announcements.html">Announcements</a>
    <a href="schedule.html">Schedule</a>
    <a href="volunteer.html" aria-current="page">Volunteer</a>
    <a href="songs.html">Songs</a>
    <a href="absent.html">Report Absence</a>
    <a href="myinfo.html">My Info</a>
    <a href="recognition.html">Recognition</a>
    <a href="sponsors.html">Sponsors &amp; Giving</a>
    <a href="join.html">Join Us</a>
    <a href="instructions.html">Instructions</a>
    <a href="countdown.html">Countdown</a>
  </nav>
</header>
<main id="main-content">
  <h2>Volunteer Signups</h2>
  <div id="status" class="placeholder-note" style="display:none;"></div>

  <div class="card member-lookup">
    <label for="lookup-email">Your Email</label>
    <input type="email" id="lookup-email" placeholder="you@example.com">
    <p><button type="button" class="btn" id="lookup-btn">Look Up</button></p>
    <div id="lookup-status"></div>
  </div>

  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  const contentEl = document.getElementById('content');
  const statusEl = document.getElementById('status');
  const lookupEmailInput = document.getElementById('lookup-email');
  const lookupBtn = document.getElementById('lookup-btn');
  const lookupStatusEl = document.getElementById('lookup-status');

  function showStatus(message) {
    statusEl.textContent = message;
    statusEl.style.display = '';
  }

  // The member found by the last successful email lookup, if any — used to
  // pre-fill (but not lock) Name/Phone when a signup form opens.
  let currentMember = null;

  async function runLookup() {
    const email = lookupEmailInput.value.trim();
    lookupStatusEl.innerHTML = '';
    if (!email) return;
    lookupBtn.disabled = true;
    try {
      const result = await lookupMember(email);
      if (result.ok) {
        currentMember = { ...result.member, email };
        saveEmail(email);
        lookupStatusEl.innerHTML = `<p class="found-note">Signing up as <strong>${escapeHtml(currentMember.name || email)}</strong>. <a class="not-you" id="not-you-link">Not you?</a></p>`;
        document.getElementById('not-you-link').addEventListener('click', () => {
          currentMember = null;
          clearSavedEmail();
          lookupEmailInput.value = '';
          lookupStatusEl.innerHTML = '';
        });
      } else {
        currentMember = null;
        lookupStatusEl.innerHTML = `<p class="placeholder-note">${escapeHtml(notFoundMessage(email))}</p>`;
      }
    } catch (e) {
      lookupStatusEl.innerHTML = `<p class="placeholder-note">Couldn't look that up right now — you can still sign up below with your name and phone.</p>`;
    }
    lookupBtn.disabled = false;
  }

  lookupBtn.addEventListener('click', runLookup);
  lookupEmailInput.addEventListener('keydown', e => { if (e.key === 'Enter') runLookup(); });

  (async () => {
    await captureSsoEmail();
    const savedEmail = getSavedEmail();
    if (savedEmail) {
      lookupEmailInput.value = savedEmail;
      runLookup();
    }
  })();

  async function loadAndRender() {
    let rows;
    try {
      rows = await fetchData('volunteerStatus');
    } catch (e) {
      showPlaceholder(contentEl, "Couldn't load right now — check your connection and try refreshing.");
      return;
    }
    if (!rows.length) {
      contentEl.innerHTML = `<p class="placeholder-note">No volunteer tasks posted yet.</p>`;
      return;
    }
    contentEl.innerHTML = rows.map(r => {
      const full = (r.SlotsFilled ?? 0) >= (r.SlotsNeeded ?? 0);
      return `
        <div class="card">
          <h3>${escapeHtml(r.TaskName)}</h3>
          <p><strong>${escapeHtml(r.Date)}</strong></p>
          <p>${r.SlotsFilled ?? 0} of ${r.SlotsNeeded ?? 0} slots filled</p>
          <div class="signup-actions" data-date="${escapeHtml(r.Date)}" data-task="${escapeHtml(r.TaskName)}">
            <button class="btn signup-btn" ${full ? 'disabled' : ''}>${full ? 'Full' : 'Sign Up'}</button>
            <form class="signup-form" style="display:none;">
              <label>Your Name<br><input type="text" class="signup-name"></label>
              <label>Phone Number (so we can text you reminders)<br><input type="tel" class="signup-phone"></label>
              <p>
                <button type="submit" class="btn confirm-signup-btn">Confirm</button>
                <button type="button" class="btn cancel-signup-btn">Cancel</button>
              </p>
            </form>
          </div>
        </div>
      `;
    }).join('');
  }

  contentEl.addEventListener('click', (ev) => {
    const signupBtn = ev.target.closest('.signup-btn');
    if (signupBtn && !signupBtn.disabled) {
      const wrap = signupBtn.closest('.signup-actions');
      signupBtn.style.display = 'none';
      const form = wrap.querySelector('.signup-form');
      form.style.display = '';
      // Pre-fill from the email lookup above, if any — still editable, so a
      // stale phone number on file doesn't block signing up.
      if (currentMember) {
        form.querySelector('.signup-name').value = currentMember.name || '';
        form.querySelector('.signup-phone').value = currentMember.cellPhone || currentMember.homePhone || '';
      }
      wrap.querySelector('.signup-name').focus();
      return;
    }

    const cancelBtn = ev.target.closest('.cancel-signup-btn');
    if (cancelBtn) {
      const wrap = cancelBtn.closest('.signup-actions');
      wrap.querySelector('.signup-form').style.display = 'none';
      wrap.querySelector('.signup-btn').style.display = '';
    }
  });

  contentEl.addEventListener('submit', async (ev) => {
    if (!ev.target.classList.contains('signup-form')) return;
    ev.preventDefault();

    const form = ev.target;
    const wrap = form.closest('.signup-actions');
    const nameInput = form.querySelector('.signup-name');
    const phoneInput = form.querySelector('.signup-phone');
    const volunteerName = nameInput.value.trim();
    const phoneNumber = phoneInput.value.trim();
    if (!volunteerName) { nameInput.focus(); return; }
    if (!phoneNumber) { phoneInput.focus(); return; }

    const confirmBtn = form.querySelector('.confirm-signup-btn');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Signing up…';
    try {
      const result = await postAction('claimSlot', {
        date: wrap.dataset.date,
        taskName: wrap.dataset.task,
        volunteerName,
        phoneNumber,
        email: (currentMember && currentMember.email) || lookupEmailInput.value.trim(),
      });
      if (result.ok) {
        showStatus(`Thanks, ${volunteerName}! You're signed up for "${wrap.dataset.task}".`);
      } else if (result.reason === 'full') {
        showStatus('Sorry, that slot just filled up.');
      } else {
        showStatus('Something went wrong signing up. Please try again.');
      }
    } catch (e) {
      showStatus('Something went wrong signing up. Please try again.');
    }
    loadAndRender();
  });

  loadAndRender();
</script>
</body>
</html>
