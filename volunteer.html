<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer | Choir App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1>South Jordan Choral Arts Community Choir</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <a href="songs.html">Songs</a>
    <a href="lyrics.html">Lyrics</a>
    <a href="announcements.html">Announcements</a>
    <a href="volunteer.html" aria-current="page">Volunteer</a>
    <a href="recognition.html">Recognition</a>
    <a href="sponsors.html">Sponsors &amp; Giving</a>
    <a href="folders.html">Music Folders</a>
    <a href="join.html">Join Us</a>
  </nav>
</header>
<main>
  <h2>Volunteer Signups</h2>
  <div id="status" class="placeholder-note" style="display:none;"></div>
  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  const contentEl = document.getElementById('content');
  const statusEl = document.getElementById('status');

  function showStatus(message) {
    statusEl.textContent = message;
    statusEl.style.display = '';
  }

  async function loadAndRender() {
    let rows;
    try {
      rows = await fetchData('volunteerStatus');
    } catch (e) {
      showPlaceholder(contentEl, "This page will show volunteer tasks (like setting up chairs) with live slot counts and a sign-up button that locks the slot once claimed, once connected to the Google Sheet.");
      return;
    }
    if (!rows.length) {
      contentEl.innerHTML = `<p class="placeholder-note">No volunteer tasks posted yet.</p>`;
      return;
    }
    contentEl.innerHTML = rows.map(r => {
      const full = (r.SlotsFilled ?? 0) >= (r.SlotsNeeded ?? 0);
      return `
        <div class="card">
          <h3>${escapeHtml(r.TaskName)}</h3>
          <p><strong>${escapeHtml(r.Date)}</strong></p>
          <p>${r.SlotsFilled ?? 0} of ${r.SlotsNeeded ?? 0} slots filled</p>
          <button class="btn" data-date="${escapeHtml(r.Date)}" data-task="${escapeHtml(r.TaskName)}" ${full ? 'disabled' : ''}>
            ${full ? 'Full' : 'Sign Up'}
          </button>
        </div>
      `;
    }).join('');
  }

  contentEl.addEventListener('click', async (ev) => {
    const button = ev.target.closest('button[data-task]');
    if (!button || button.disabled) return;

    const volunteerName = prompt('Your name, for the sign-up sheet:');
    if (!volunteerName || !volunteerName.trim()) return;

    button.disabled = true;
    button.textContent = 'Signing up…';
    try {
      const result = await postAction('claimSlot', {
        date: button.dataset.date,
        taskName: button.dataset.task,
        volunteerName: volunteerName.trim(),
      });
      if (result.ok) {
        showStatus(`Thanks, ${volunteerName.trim()}! You're signed up for "${button.dataset.task}".`);
      } else if (result.reason === 'full') {
        showStatus('Sorry, that slot just filled up.');
      } else {
        showStatus('Something went wrong signing up. Please try again.');
      }
    } catch (e) {
      showStatus('Something went wrong signing up. Please try again.');
    }
    loadAndRender();
  });

  loadAndRender();
</script>
</body>
</html>
