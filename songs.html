<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>SOJO Choral Arts Seasons Chorale Choir</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>

  </nav>
</header>
<main id="main-content">
  <h2>Song Library</h2>
  <div id="content">Loading songs&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const rows = await fetchData('songs');
      if (!rows.length) {
        el.innerHTML = `<p class="placeholder-note">No songs listed yet.</p>`;
        return;
      }
      el.innerHTML = rows.map(r => `
        <div class="card">
          <h3>${r.Title || ''}</h3>
          ${r.Status ? `<span class="badge">${r.Status}</span>` : ''}
          ${r.LastRehearsedDate ? `<p>Last rehearsed: ${r.LastRehearsedDate}</p>` : ''}
          ${r.RehearsalTrackURL ? `<p><a class="btn" href="${r.RehearsalTrackURL}" target="_blank" rel="noopener">Rehearsal Track</a></p>` : ''}
          ${r.YouTubeURL ? `<p><a class="btn" href="${r.YouTubeURL}" target="_blank" rel="noopener">Watch on YouTube</a></p>` : ''}
        </div>
      `).join('');
    } catch (e) {
      showPlaceholder(el, "This page will list our songs with rehearsal tracks, YouTube links, and rehearsal status once the site is connected to the Google Sheet (Phase 1).");
    }
  })();
</script>
</body>
</html>
