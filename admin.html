<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Choir App</title>
<link rel="stylesheet" href="style.css">
<style>
  .admin-table-wrap { overflow-x: auto; margin-bottom: 1.5rem; }
  table.admin-table { border-collapse: collapse; width: 100%; }
  table.admin-table th, table.admin-table td {
    border: 1px solid var(--color-border);
    padding: 0.4rem;
    vertical-align: top;
  }
  table.admin-table th { background: var(--color-pinned-bg); text-align: left; }
  table.admin-table input[type="text"], table.admin-table textarea {
    width: 100%;
    max-width: none;
    min-width: 8rem;
    font-size: 0.95rem;
    padding: 0.3rem;
    box-sizing: border-box;
  }
  table.admin-table td:last-child { white-space: nowrap; }
  table.admin-table .btn { font-size: 0.9rem; padding: 0.4rem 0.7rem; margin: 0.1rem; }
  table.admin-table input[type="date"], table.admin-table input[type="time"] {
    min-width: 6rem;
    font-size: 0.95rem;
    padding: 0.3rem;
    box-sizing: border-box;
  }
  .long-text-field { display: flex; flex-direction: column; gap: 0.3rem; }
  .expand-btn { font-size: 0.8rem !important; padding: 0.25rem 0.5rem !important; align-self: flex-start; }

  #expand-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  #expand-modal .card {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  #expand-textarea {
    width: 100%;
    min-height: 50vh;
    font-size: 1.1rem;
    padding: 0.75rem;
    border-radius: var(--radius);
    border: 1px solid var(--color-border);
    box-sizing: border-box;
    font-family: inherit;
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>SOJO Choral Arts Seasons Chorale Choir &mdash; Admin</h1>
</header>
<main id="main-content">
  <div id="login-screen" class="card">
    <h2>Log In</h2>
    <p id="auth-error" class="placeholder-note" style="display:none;">Incorrect email or password.</p>
    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="username">
    <label for="login-pw">Password</label>
    <input type="password" id="login-pw" autocomplete="current-password">
    <p><button id="login-btn" class="btn">Log In</button></p>
    <p class="placeholder-note">Same login as My Apps Hub. Not signed up yet? Sign up there first, then ask to be granted access to this app.</p>
  </div>

  <div id="panel" style="display:none;">
    <p><button id="logout-btn" class="btn">Log Out</button></p>
    <label for="table-select">Table</label>
    <select id="table-select"></select>
    <div id="status" class="placeholder-note" style="display:none;"></div>
    <div id="table-container"></div>
  </div>
</main>
<div id="expand-modal">
  <div class="card">
    <h2 id="expand-title">Edit Text</h2>
    <textarea id="expand-textarea"></textarea>
    <p>
      <button id="expand-save" class="btn">Use This Text</button>
      <button id="expand-cancel" class="btn">Cancel</button>
    </p>
  </div>
</div>
<footer class="site-footer">Choir App &mdash; admin maintenance panel</footer>
<script src="js/api.js"></script>
<script>
  const TABLES = {
    Schedule: ['Date', 'Time', 'Type', 'Title', 'Location', 'ParkingNotes', 'EntranceNotes', 'Notes'],
    Songs: ['Title', 'RehearsalTrackURL', 'YouTubeURL', 'LastRehearsedDate', 'Status'],
    Lyrics: ['SongTitle', 'Part', 'LyricsText'],
    Announcements: ['Date', 'Author', 'Message', 'Pinned'],
    VolunteerTasks: ['Date', 'TaskName', 'SlotsNeeded'],
    VolunteerSignups: ['Date', 'TaskName', 'VolunteerName', 'PhoneNumber', 'Timestamp'],
    Absences: ['Date', 'MemberName', 'Position', 'Note', 'Timestamp'],
    Recognition: ['Date', 'MemberName', 'Message'],
    Sponsors: ['SponsorName', 'LogoURL', 'Message', 'Tier'],
    Settings: ['Key', 'Value'],
    SectionLeaders: ['Position', 'LeaderName', 'LeaderEmail'],
  };
  const LONG_TEXT_COLUMNS = new Set(['LyricsText', 'Message', 'Notes', 'Note', 'Value']);
  const DATE_COLUMNS = new Set(['Date', 'LastRehearsedDate']);
  const TIME_COLUMNS = new Set(['Time']);
  const POSITION_COLUMNS = new Set(['Position']);
  const POSITIONS = [
    'Soprano - 1st', 'Soprano - 2nd', 'Alto - 1st', 'Alto - 2nd',
    'Tenor - 1st', 'Tenor - 2nd', 'Bass - 1st', 'Bass - 2nd', 'HOLD',
  ];

  // Sheet Time cells come back formatted as "7:00 PM" (see Code.gs formatCell), but
  // <input type="time"> needs 24-hour "HH:MM". Convert both directions.
  function to24Hour(str) {
    const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((str || '').trim());
    if (!m) return '';
    let h = parseInt(m[1], 10);
    if (/PM/i.test(m[3]) && h !== 12) h += 12;
    if (/AM/i.test(m[3]) && h === 12) h = 0;
    return String(h).padStart(2, '0') + ':' + m[2];
  }

  function to12Hour(hhmm) {
    if (!hhmm) return '';
    const [hStr, mStr] = hhmm.split(':');
    let h = parseInt(hStr, 10);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return h + ':' + mStr + ' ' + ampm;
  }

  // Strips a typed phone number down to digits (keeping a leading +) for sms: links.
  function toSmsNumber(raw) {
    // Google Sheets auto-detects all-digit text (e.g. a phone number typed with no dashes)
    // as a Number, not a string -- so `raw` may already be a number here, and calling
    // .replace() on it directly would throw. Coerce to string first.
    return String(raw ?? '').replace(/[^\d+]/g, '');
  }

  const loginScreen = document.getElementById('login-screen');
  const panel = document.getElementById('panel');
  const authError = document.getElementById('auth-error');
  const tableSelect = document.getElementById('table-select');
  const tableContainer = document.getElementById('table-container');
  const statusEl = document.getElementById('status');

  function showStatus(message) {
    statusEl.textContent = message;
    statusEl.style.display = '';
  }

  // Session-scoped, not localStorage: this panel edits real member data
  // (phone numbers, absence notes), so on a shared computer the login
  // clears itself automatically when the tab closes, same as the old
  // shared-password version did.
  const AUTH_KEY = 'choirAdminAuth';
  let auth = null; // { token, displayName }
  function loadAuth() { try { return JSON.parse(sessionStorage.getItem(AUTH_KEY)); } catch { return null; } }
  function saveAuth(a) { sessionStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
  function clearAuth() { sessionStorage.removeItem(AUTH_KEY); }

  // No auth yet during the login call itself, so only attach the header once
  // we actually have a token (login/checkAccess-before-login run without one).
  function authHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    if (auth && auth.token) headers['Authorization'] = `Bearer ${auth.token}`;
    return headers;
  }

  // api.php reads `action` from the POST body (not the query string), same
  // as every other action in this app — see api/api.php's router.
  async function callAdmin(action, payload) {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({ action, ...(payload || {}) }),
    });
    return res.json();
  }

  async function checkAccess() {
    try {
      const result = await callAdmin('checkAccess');
      return !!result.ok;
    } catch (e) {
      return false;
    }
  }

  function showLogin(message) {
    clearAuth();
    auth = null;
    panel.style.display = 'none';
    loginScreen.style.display = '';
    authError.style.display = message ? '' : 'none';
    if (message) authError.textContent = message;
  }

  function showPanel() {
    loginScreen.style.display = 'none';
    panel.style.display = '';
    if (!tableSelect.options.length) {
      tableSelect.innerHTML = Object.keys(TABLES).map(t => `<option value="${t}">${t}</option>`).join('');
      tableSelect.addEventListener('change', () => loadTable(tableSelect.value));
      loadTable(tableSelect.value);
    }
  }

  async function attemptLogin() {
    const username = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pw').value;
    authError.style.display = 'none';
    if (!username || !password) return;
    try {
      const data = await callAdmin('login', { username, password });
      if (!data.token) {
        authError.textContent = data.error || 'Incorrect email or password.';
        authError.style.display = '';
        return;
      }
      auth = { token: data.token, displayName: data.displayName || username };
      saveAuth(auth);
      if (await checkAccess()) {
        showPanel();
      } else {
        showLogin("You're logged in, but not authorized for this admin panel. Ask to be granted access.");
      }
    } catch (e) {
      authError.textContent = 'Something went wrong logging in. Please try again.';
      authError.style.display = '';
    }
  }

  document.getElementById('login-btn').addEventListener('click', attemptLogin);
  document.getElementById('login-pw').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') attemptLogin(); });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    try { await callAdmin('logout', { token: auth.token }); } catch (e) {}
    showLogin();
  });

  function fieldInput(col, value) {
    const safeVal = escapeHtml(value ?? '');
    if (DATE_COLUMNS.has(col)) {
      return `<input type="date" data-col="${col}" value="${safeVal}">`;
    }
    if (TIME_COLUMNS.has(col)) {
      return `<input type="time" data-col="${col}" value="${escapeHtml(to24Hour(value))}">`;
    }
    if (POSITION_COLUMNS.has(col)) {
      const options = ['', ...POSITIONS].map(p =>
        `<option value="${p}" ${p === value ? 'selected' : ''}>${p || '(none)'}</option>`
      ).join('');
      return `<select data-col="${col}">${options}</select>`;
    }
    if (LONG_TEXT_COLUMNS.has(col)) {
      return `<div class="long-text-field">
        <textarea data-col="${col}" rows="2">${safeVal}</textarea>
        <button type="button" class="btn expand-btn">Expand</button>
      </div>`;
    }
    return `<input type="text" data-col="${col}" value="${safeVal}">`;
  }

  function readRow(tr, columns) {
    const values = {};
    columns.forEach(col => {
      const el = tr.querySelector(`[data-col="${col}"]`);
      values[col] = TIME_COLUMNS.has(col) ? to12Hour(el.value) : el.value;
    });
    return values;
  }

  let expandTarget = null;
  function openExpandEditor(textarea) {
    expandTarget = textarea;
    document.getElementById('expand-textarea').value = textarea.value;
    document.getElementById('expand-modal').style.display = 'flex';
    document.getElementById('expand-textarea').focus();
  }
  function closeExpandEditor() {
    document.getElementById('expand-modal').style.display = 'none';
    expandTarget = null;
  }
  document.getElementById('expand-save').addEventListener('click', () => {
    if (expandTarget) expandTarget.value = document.getElementById('expand-textarea').value;
    closeExpandEditor();
  });
  document.getElementById('expand-cancel').addEventListener('click', closeExpandEditor);

  async function loadTable(sheetName) {
    tableContainer.innerHTML = 'Loading…';

    // VolunteerTasks uses a dedicated action that computes phone numbers per task
    // server-side, in one request — mirrors how the public volunteerStatus endpoint
    // reads VolunteerTasks + VolunteerSignups together.
    const action = sheetName === 'VolunteerTasks' ? 'adminVolunteerTasks' : 'adminList';
    let result;
    try {
      result = await callAdmin(action, { sheet: sheetName });
    } catch (e) {
      tableContainer.innerHTML = `<p class="placeholder-note">Couldn't load ${escapeHtml(sheetName)}. Please try again.</p>`;
      return;
    }
    if (!result.ok) {
      if (/session|authoriz/i.test(result.error || '')) {
        showLogin('Your saved login stopped working. Please log in again.');
      } else {
        tableContainer.innerHTML = `<p class="placeholder-note">Not authorized.</p>`;
      }
      return;
    }

    renderTable(sheetName, result.rows);
  }

  function copyNumbersButton(phoneNumbers) {
    const numbers = [...new Set((phoneNumbers || []).map(toSmsNumber).filter(n => n))];
    if (!numbers.length) {
      return `<span class="btn" style="opacity:0.5;" title="No phone numbers on file for this task">No Numbers</span>`;
    }
    // No sms: link here: iOS/Android inconsistently honor multiple comma-separated
    // recipients (sometimes only the first one opens), so copy-and-paste into Messages
    // is the reliable option.
    return `<button type="button" class="btn copy-numbers-btn" data-numbers="${numbers.join(', ')}">Copy Numbers (${numbers.length})</button>`;
  }

  function renderTable(sheetName, rows) {
    const columns = TABLES[sheetName];
    const headHtml = columns.map(c => `<th scope="col">${c}</th>`).join('') + '<th scope="col">Actions</th>';
    const bodyHtml = rows.map(r => `
      <tr data-row="${r._row}">
        ${columns.map(c => `<td>${fieldInput(c, r[c])}</td>`).join('')}
        <td>
          <button class="btn" data-action="save">Save</button>
          <button class="btn" data-action="delete">Delete</button>
          ${sheetName === 'VolunteerTasks' ? copyNumbersButton(r.PhoneNumbers) : ''}
        </td>
      </tr>
    `).join('');
    const addRowHtml = `
      <tr id="add-row">
        ${columns.map(c => `<td>${fieldInput(c, '')}</td>`).join('')}
        <td><button class="btn" data-action="add">Add</button></td>
      </tr>
    `;
    tableContainer.innerHTML = `
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr>${headHtml}</tr></thead>
          <tbody>${bodyHtml}${addRowHtml}</tbody>
        </table>
      </div>
    `;

    tableContainer.querySelectorAll('button[data-action]').forEach(button => {
      button.addEventListener('click', () => handleAction(sheetName, columns, button));
    });
    tableContainer.querySelectorAll('.expand-btn').forEach(button => {
      button.addEventListener('click', () => openExpandEditor(button.previousElementSibling));
    });
    tableContainer.querySelectorAll('.copy-numbers-btn').forEach(button => {
      button.addEventListener('click', () => copyNumbers(button));
    });
  }

  async function copyNumbers(button) {
    await copyToClipboard(button.dataset.numbers, button, (text) => {
      showStatus(`Couldn't copy automatically — here are the numbers: ${text}`);
    });
  }

  async function handleAction(sheetName, columns, button) {
    const action = button.dataset.action;
    const tr = button.closest('tr');

    if (action === 'add') {
      const row = readRow(tr, columns);
      button.disabled = true;
      const result = await callAdmin('adminAdd', { sheet: sheetName, row }).catch(() => ({ ok: false }));
      if (result.ok) {
        loadTable(sheetName);
      } else {
        showStatus('Could not add that row. Please try again.');
        button.disabled = false;
      }
      return;
    }

    const rowNumber = Number(tr.dataset.row);

    if (action === 'save') {
      const values = readRow(tr, columns);
      button.disabled = true;
      const result = await callAdmin('adminUpdate', { sheet: sheetName, row: rowNumber, values }).catch(() => ({ ok: false }));
      if (result.ok) {
        showStatus('Saved.');
      } else {
        showStatus('Could not save that row. Please try again.');
      }
      button.disabled = false;
      return;
    }

    if (action === 'delete') {
      if (!confirm('Delete this row? This cannot be undone.')) return;
      button.disabled = true;
      const result = await callAdmin('adminDelete', { sheet: sheetName, row: rowNumber }).catch(() => ({ ok: false }));
      if (result.ok) {
        loadTable(sheetName);
      } else {
        showStatus('Could not delete that row. Please try again.');
        button.disabled = false;
      }
    }
  }

  (async () => {
    // Single sign-on: My Apps Hub launches this app with ?token=... when the
    // visitor is already logged in there, so this skips its own login screen.
    const ssoToken = new URLSearchParams(window.location.search).get('token');
    if (ssoToken) {
      auth = { token: ssoToken, displayName: '' };
      saveAuth(auth);
      window.history.replaceState({}, document.title, window.location.pathname);
    } else {
      auth = loadAuth();
    }
    if (!auth) return;
    if (await checkAccess()) {
      showPanel();
    } else {
      showLogin("You're logged in, but not authorized for this admin panel. Ask to be granted access.");
    }
  })();
</script>
</body>
</html>
