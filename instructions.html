  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Choir App &mdash; built for our community</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const settings = await fetchData('settings');
      const instructions = (settings.find(s => s.Key === 'InstructionsText') || {}).Value;
      el.innerHTML = instructions
        ? `<div class="card">${formatText(instructions)}</div>`
        : `<p class="placeholder-note">No instructions have been set yet. The director can add them via the admin panel (Settings &rarr; InstructionsText).</p>`;
    } catch (e) {
      showPlaceholder(el, "Couldn't load right now — check your connection and try refreshing.");
    }
  })();
</script>
